name: market-dashboard

on:
  schedule:
    - cron: "30 23 * * *"   # 07:30 Asia/Shanghai — after US close
    - cron: "30 10 * * *"   # 18:30 Asia/Shanghai — after Asia close
  workflow_dispatch:
    inputs:
      slot:
        description: "morning / evening / auto"
        default: "auto"
      notify:
        description: "Send Telegram (true/false)"
        default: "true"
      twse_budget:
        description: "Seconds to spend backfilling TWSE history"
        default: "420"

permissions:
  contents: write

concurrency:
  group: market-dashboard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWSE_BUDGET: ${{ github.event.inputs.twse_budget || '420' }}
        run: |
          ARGS="--slot ${{ github.event.inputs.slot || 'auto' }}"
          if [ "${{ github.event.inputs.notify }}" = "false" ]; then ARGS="$ARGS --no-notify"; fi
          python -m pipeline.main $ARGS

      - name: Commit data and page
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs state
          git commit -m "update $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git pull --rebase -X ours || true
          git push
